media:
  input: media
  output: /media
  rename: safe
  extensions: [jpg, jpeg, png, webp]

settings:
  hide: true
  content:
    merge: true

content:
  - name: works
    label: آثار
    type: collection
    path: _works
    filename: "{fields.slug}.md"
    view:
      fields: [title, date, category, featured]
    fields:
      - { name: title, label: عنوان, type: string, required: true }
      - name: slug
        label: نام فنی نشانی
        type: string
        required: true
        description: فقط حروف کوچک انگلیسی، عدد و خط تیره؛ مانند work-001
        pattern:
          regex: "^[a-z0-9-]+$"
          message: فقط حروف کوچک انگلیسی، عدد و خط تیره مجاز است.
      - { name: date, label: تاریخ, type: date, required: true }
      - name: category
        label: دسته‌بندی
        type: select
        required: true
        options:
          values: [عکاسی, فیلم, رسانه ترکیبی, طراحی, نقاشی, نوشتار, سایر]
      - name: summary
        label: معرفی کوتاه
        type: text
        required: true
        description: یک یا دو جمله کوتاه.
        options: { minlength: 10, maxlength: 300 }
      - name: cover
        label: تصویر اصلی
        type: image
        required: true
        options: { path: works, extensions: [jpg, jpeg, png, webp] }
      - name: cover_alt
        label: توضیح تصویر اصلی
        type: string
        required: true
        description: شرح کوتاه آنچه در تصویر دیده می‌شود.
      - name: gallery
        label: گالری تصاویر
        type: image
        options:
          path: works
          multiple: { max: 20 }
          unique: true
          extensions: [jpg, jpeg, png, webp]
      - name: video
        label: لینک ویدئو
        type: string
        description: اختیاری؛ لینک کامل ویدئو.
      - { name: featured, label: نمایش در صفحه اصلی, type: boolean }
      - name: body
        label: متن کامل
        type: rich-text
        required: true
        options: { media: false, format: markdown, switcher: false }

  - name: notes
    label: یادداشت‌ها
    type: collection
    path: _notes
    filename: "{fields.slug}.md"
    view: { fields: [title, date] }
    fields:
      - { name: title, label: عنوان, type: string, required: true }
      - name: slug
        label: نام فنی نشانی
        type: string
        required: true
        description: فقط حروف کوچک انگلیسی، عدد و خط تیره؛ مانند note-001
        pattern:
          regex: "^[a-z0-9-]+$"
          message: فقط حروف کوچک انگلیسی، عدد و خط تیره مجاز است.
      - { name: date, label: تاریخ, type: date, required: true }
      - name: image
        label: تصویر اختیاری
        type: image
        options: { path: notes, extensions: [jpg, jpeg, png, webp] }
      - { name: image_alt, label: توضیح تصویر, type: string }
      - name: body
        label: متن
        type: rich-text
        required: true
        options: { media: false, format: markdown, switcher: false }
