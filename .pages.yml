media:
  input: media
  output: /media
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: works
    label: آثار
    type: collection
    path: _works
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      primary: title
      fields: [date, category, published, featured]
    fields:
      - { name: title, label: عنوان, type: string, required: true, options: { maxlength: 120 } }
      - { name: date, label: سال یا تاریخ اثر, type: date, required: true, options: { format: yyyy-MM-dd } }
      - name: category
        label: نوع اثر / مدیوم
        type: string
        required: true
      - { name: dimensions, label: ابعاد, type: string }
      - { name: location, label: مکان یا نمایشگاه, type: string }
      - name: summary
        label: توضیح کوتاه
        type: text
        required: true
        options: { minlength: 10, maxlength: 300 }
      - name: cover
        label: تصویر اصلی
        type: image
        required: true
        options: { path: works, extensions: [jpg, jpeg, png, webp], rename: safe }
      - { name: cover_alt, label: توضیح تصویر اصلی, type: string }
      - name: gallery
        label: تصاویر بیشتر
        type: image
        options:
          path: works
          multiple: { max: 20 }
          unique: true
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - { name: video, label: لینک ویدئو, type: string }
      - name: body
        label: متن اثر
        type: rich-text
        required: true
        options: { media: false, format: markdown, switcher: false }
      - { name: credits, label: اطلاعات تکمیلی / اعتبارها, type: text }
      - { name: external_url, label: لینک بیرونی, type: string }
      - { name: featured, label: نمایش در صفحه اصلی, type: boolean, default: false }
      - { name: published, label: انتشار, type: boolean, default: false }

  - name: notes
    label: یادداشت‌ها
    type: collection
    path: _notes
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      primary: title
      fields: [date, published]
    fields:
      - { name: title, label: عنوان, type: string, required: true, options: { maxlength: 160 } }
      - { name: date, label: تاریخ, type: date, required: true, options: { format: yyyy-MM-dd } }
      - name: image
        label: تصویر اختیاری
        type: image
        options: { path: notes, extensions: [jpg, jpeg, png, webp], rename: safe }
      - { name: image_alt, label: توضیح تصویر, type: string }
      - name: body
        label: متن
        type: rich-text
        required: true
        options: { media: false, format: markdown, switcher: false }
      - { name: published, label: انتشار, type: boolean, default: false }

  - name: about
    label: درباره هنرمند
    type: file
    path: about/index.md
    fields:
      - { name: title, label: عنوان صفحه, type: string, required: true }
      - name: body
        label: متن درباره
        type: rich-text
        required: true
        options: { media: false, format: markdown, switcher: false }

  - name: site
    label: تنظیمات سایت و ارتباط
    type: file
    path: _data/site.yml
    fields:
      - { name: artist_name, label: نام هنرمند, type: string, required: true }
      - { name: homepage_title, label: عنوان صفحه اصلی, type: string }
      - { name: homepage_intro, label: معرفی کوتاه صفحه اصلی, type: text }
      - { name: footer_text, label: متن پایین صفحه, type: text }
      - { name: location, label: محل فعالیت, type: string }
      - { name: portrait, label: پرتره اختیاری, type: image, options: { path: site, extensions: [jpg, jpeg, png, webp], rename: safe } }
      - { name: email, label: ایمیل, type: string }
      - name: social_links
        label: شبکه‌های اجتماعی و لینک‌ها
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: label, label: عنوان, type: string, required: true }
          - { name: url, label: لینک کامل, type: string, required: true }