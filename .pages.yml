media:
  input: media
  output: /media
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: works
    label: Works
    type: collection
    path: _works
    filename: "{fields.slug}.md"

    view:
      fields: [title, date, category, featured]

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: URL name
        type: string
        required: true
        description: Use lowercase English letters, numbers, and hyphens only. Example empty-rooms
        pattern:
          regex: "^[a-z0-9-]+$"
          message: Use lowercase English letters, numbers, and hyphens only.

      - name: date
        label: Date
        type: date
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Photography
            - Film
            - Mixed media
            - Drawing
            - Painting
            - Writing
            - Other

      - name: summary
        label: Short summary
        type: text
        required: true
        description: One or two sentences shown with the work on listing pages.
        options:
          minlength: 10
          maxlength: 300

      - name: cover
        label: Cover image
        type: image
        required: true
        options:
          path: works
          extensions: [jpg, jpeg, png, webp]

      - name: cover_alt
        label: Cover image description
        type: string
        required: true
        description: Briefly describe the image for visitors who cannot see it.

      - name: gallery
        label: Gallery
        type: image
        options:
          path: works
          multiple:
            max: 20
          unique: true
          extensions: [jpg, jpeg, png, webp]

      - name: aparat
        label: Aparat video link
        type: string
        description: Optional. Paste the full Aparat video address.

      - name: featured
        label: Feature on home page
        type: boolean

      - name: body
        label: Description
        type: rich-text
        required: true
        options:
          media: false
          format: markdown
          switcher: false

  - name: notes
    label: Notes
    type: collection
    path: _notes
    filename: "{fields.slug}.md"

    view:
      fields: [title, date]

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: URL name
        type: string
        required: true
        description: Use lowercase English letters, numbers, and hyphens only. Example unfinished-things
        pattern:
          regex: "^[a-z0-9-]+$"
          message: Use lowercase English letters, numbers, and hyphens only.

      - name: date
        label: Date
        type: date
        required: true

      - name: image
        label: Optional image
        type: image
        options:
          path: notes
          extensions: [jpg, jpeg, png, webp]

      - name: image_alt
        label: Image description
        type: string
        description: If you add an image, briefly describe what it shows.

      - name: body
        label: Text
        type: rich-text
        required: true
        options:
          media: false
          format: markdown
          switcher: false