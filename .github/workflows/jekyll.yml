name: Verify Jekyll site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: bundle install
      - run: bundle exec jekyll build --trace
      - run: ruby script/verify_site.rb
      - run: ruby script/verify_pages_cms_schema.rb
      - run: ruby script/verify_publication_gate.rb
