---
layout: default
title: یادداشت‌ها
---
<section class="narrow intro"><p class="eyebrow">دفتر</p><h1>یادداشت‌ها</h1></section>
<section class="narrow section"><div class="note-list">
{% assign notes = site.notes | sort: 'date' | reverse %}
{% for note in notes %}<a href="{{ note.url | relative_url }}"><span>{{ note.title }}</span><time>{{ note.date | date: '%Y/%m/%d' }}</time></a>
{% else %}<p class="empty">هنوز یادداشتی منتشر نشده است.</p>{% endfor %}
</div></section>
