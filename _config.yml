title: وحید علیمردانی
description: آرشیو آثار، تصاویر، فیلم‌ها و یادداشت‌های وحید علیمردانی
url: "https://vahidalimardani-art.github.io"
baseurl: ""
lang: fa
direction: rtl
markdown: kramdown
permalink: pretty
collections:
  works:
    output: true
    permalink: /works/:name/
  notes:
    output: true
    permalink: /notes/:name/
defaults:
  - scope: { path: "", type: works }
    values: { layout: work }
  - scope: { path: "", type: notes }
    values: { layout: note }
  - scope: { path: about }
    values: { layout: about }
exclude:
  - README.md