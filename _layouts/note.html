---
layout: default
---
<article class="note-page">
  <header class="page-heading">
    {% if page.date %}<p class="eyebrow" dir="ltr">{{ page.date | date: "%Y/%m/%d" }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
  </header>
  {% if page.image %}
    <figure class="note-image"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}"></figure>
  {% endif %}
  <section class="prose">{{ content }}</section>
  <p class="return-link"><a href="{{ '/notes/' | relative_url }}">بازگشت به یادداشت‌ها</a></p>
</article>
