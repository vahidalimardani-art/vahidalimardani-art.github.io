{% assign info = site.data.site %}
<!doctype html>
<html lang="{{ site.lang | default: 'fa' }}" dir="{{ site.direction | default: 'rtl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ info.artist_name | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: info.homepage_intro | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:type" content="{% if page.layout == 'work' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ info.artist_name | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: info.homepage_intro | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  {% if page.cover %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="page page--{{ page.layout | default: 'default' }}">
  <a class="skip-link" href="#main-content">پرش به محتوا</a>
  {% include site-header.html %}
  <main id="main-content">{{ content }}</main>
  {% include site-footer.html %}
</body>
</html>
