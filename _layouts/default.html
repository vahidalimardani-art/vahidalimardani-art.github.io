<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="ناوبری اصلی">
      <a href="{{ '/works/' | relative_url }}">آثار</a>
      <a href="{{ '/notes/' | relative_url }}">یادداشت‌ها</a>
      <a href="{{ '/about/' | relative_url }}">درباره</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer"><p>© {{ site.time | date: '%Y' }} {{ site.title }}</p></footer>
</body>
</html>
