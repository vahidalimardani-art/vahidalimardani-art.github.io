<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="صفحه اصلی {{ site.title }}">
    <span class="brand-mark" aria-hidden="true">و</span>
    <span>{{ site.title }}</span>
  </a>
  <nav aria-label="ناوبری اصلی">
    <a{% if page.url contains '/works/' %} class="active"{% endif %} href="{{ '/works/' | relative_url }}">آثار</a>
    <a{% if page.url contains '/notes/' %} class="active"{% endif %} href="{{ '/notes/' | relative_url }}">یادداشت‌ها</a>
    <a{% if page.url contains '/about/' %} class="active"{% endif %} href="{{ '/about/' | relative_url }}">درباره</a>
  </nav>
</header>
